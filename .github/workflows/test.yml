name: test
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        if: runner.os == 'Linux'
        run: shellcheck -S warning bin/relay lib/runner.sh lib/common.sh test/smoke.sh install.sh
      - name: smoke test (stub claude + agy)
        run: |
          git config --global user.email ci@example.com
          git config --global user.name ci
          bash test/smoke.sh
